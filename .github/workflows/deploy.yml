name: Build, Push to Docker Hub and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Logowanie do Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Konfiguracja Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Budowanie i wysyłanie obrazu do Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: r3venge1337/simple-server-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Połączenie SSH i wdrożenie na Debianie
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/moja-aplikacja
            docker compose pull
            docker compose up -d
